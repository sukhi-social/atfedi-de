name: FediDB
lane: use
category: utility
summary:
  en: Statistics and a searchable list of fediverse servers and software — handy for seeing how big a server is, or what it runs on.
  ja: フェディバースのサーバーとソフトウェアの統計と、検索できるサーバーの一覧。サーバーの大きさや、なにで動いているかを見るのに便利。
  ko: 페디버스 서버와 소프트웨어의 통계, 그리고 검색할 수 있는 서버 목록이에요. 어떤 서버가 얼마나 큰지, 무엇으로 돌아가는지 볼 때 편해요.
links:
  home: https://fedidb.org
