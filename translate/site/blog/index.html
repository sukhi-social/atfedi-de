<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>write / blog — atfedi.de</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="data:," />
<link rel="stylesheet" href="/style.css" />
<link rel="stylesheet" href="/blog/blog.css" />

<div class="desk blogdesk">
  <header>
    <div class="title-tag">write <small id="tag"></small></div>
    <div class="corner"><a id="back" href="/"></a></div>
  </header>

  <p class="hint" id="howto"></p>

  <nav class="pick">
    <label><span id="l-post"></span> <select id="post"></select></label>
    <label><span id="l-lang"></span> <select id="lang"></select></label>
  </nav>

  <textarea id="text" spellcheck="false" aria-labelledby="l-post" disabled></textarea>

  <footer class="actions blogactions">
    <button type="button" id="send" disabled></button>
    <span id="status" role="status"></span>
  </footer>
  <p class="hint" id="path"></p>
</div>

<script type="module" src="/blog/blog.js"></script>
</html>
